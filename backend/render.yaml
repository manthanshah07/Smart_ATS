# render.yaml — SmartATS Backend Deployment Configuration
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: smartats-api
    runtime: python
    region: oregon

    # ─── Build ──────────────────────────────────────────────────────────────────
    # Steps run once at deploy time in the build container:
    # 1. Install Python dependencies from requirements.txt
    # 2. Download spaCy English model (required by extractor.py)
    # 3. Collect static files (served by WhiteNoise)
    # 4. Apply database migrations against Neon
    buildCommand: |
      pip install -r requirements.txt &&
      python -m spacy download en_core_web_sm &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate

    # ─── Start ──────────────────────────────────────────────────────────────────
    # Gunicorn binds to the PORT assigned by Render's infrastructure.
    # --workers 2: conservative for AI model memory; increase if needed.
    # --timeout 120: sentence-transformer embeddings can take up to 30s on first load.
    startCommand: gunicorn smart_ats.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120

    # ─── Environment Variables ─────────────────────────────────────────────────
    # These are PLACEHOLDERS. Replace with real values in the Render dashboard
    # (Settings → Environment). Never commit secrets to this file.
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: smart_ats.settings

      - key: DEBUG
        value: "False"

      # SECRET_KEY — generate with:
      # python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())"
      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a random value on first deploy

      # DATABASE_URL — copy from your Neon project dashboard → Connection Details
      # Format: postgresql://USER:PASSWORD@HOST/DBNAME?sslmode=require
      - key: DATABASE_URL
        sync: false  # Must be set manually in Render dashboard

      # ALLOWED_HOSTS — your Render service subdomain (e.g. smartats-api.onrender.com)
      # Also include any custom domain you add later
      - key: ALLOWED_HOSTS
        sync: false  # Must be set manually in Render dashboard

      # CORS_ALLOWED_ORIGINS — your Vercel frontend URL (e.g. https://smartats.vercel.app)
      # Multiple origins comma-separated without spaces
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # Must be set manually in Render dashboard

      # EMAIL_BACKEND — optional SMTP for production password reset emails
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend

      - key: DEFAULT_FROM_EMAIL
        value: noreply@smartats.io

    # ─── Health Check ───────────────────────────────────────────────────────────
    # Render pings this endpoint to verify the service is alive.
    # Returns {"status": "ok"} with HTTP 200.
    healthCheckPath: /api/v1/health/
